[package]
name = "mouce"
version = "0.1.0"
description = "mouce"
edition = "2021"

[lib]
name = "mouce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "limits", "hooks"] }
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.23"
tauri-plugin-log = "2"
log = "0.4"

# Screen pictures are encoded and scaled on every look and circle; unoptimised, that takes
# seconds in a dev build.
[profile.dev.package.image]
opt-level = 3

# The shipped build: optimised across crates and without debug symbols, for a smaller
# and faster exe. `panic` stays "unwind" so a panic in one async task is caught by the
# runtime (and logged) instead of closing mouce.
[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
