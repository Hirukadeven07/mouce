# Dependabot opens PRs for security fixes as soon as an advisory appears, and for routine
# updates once a week. Minor and patch updates are grouped into one PR per ecosystem;
# major updates (which can break things) each get their own PR. Packages that must stay on
# matching versions are grouped for every kind of update, so they never arrive split.
# A dependency joins the first group it matches.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tauri:
        patterns: ["@tauri-apps/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
