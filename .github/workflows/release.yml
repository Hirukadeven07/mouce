name: Release

# Pushing a version tag (for example `v0.2.0`) builds the Windows installer and attaches
# it to a draft GitHub Release. Nothing is published until someone reviews the draft
# and presses Publish.
#
# The build runs with read-only access: `npm ci`, the build scripts and every crate's
# build.rs never hold a token that can change the repository or its releases. Only the
# small `release` job, which runs no project code, can write.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    name: Build installer
    runs-on: windows-latest
    # The release profile uses full LTO, which makes the final link slow.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "tag $tag, package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in all three files"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci

      # Code signing goes here once there is a certificate; until then Windows
      # SmartScreen warns that the publisher is unknown.
      # `--locked`: the shipped build uses exactly the reviewed Cargo.lock.
      - name: Build the installer
        run: npm run tauri -- build -- --locked

      - name: Write a checksum
        id: files
        working-directory: src-tauri/target/release/bundle/nsis
        run: |
          installer=$(ls *-setup.exe)
          sha256sum "$installer" > "$installer.sha256"
          cat "$installer.sha256"
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            src-tauri/target/release/bundle/nsis/${{ steps.files.outputs.installer }}
            src-tauri/target/release/bundle/nsis/${{ steps.files.outputs.installer }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to a draft release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Check the checksum
        working-directory: installer
        run: sha256sum --check ./*.sha256

      - name: Attach to a draft release
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(./*)
          # Re-running the workflow for the same tag replaces the files on its draft.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --draft --title "mouce $GITHUB_REF_NAME" --generate-notes
          fi
