name: Audit

# Checks the locked dependencies against the RustSec and npm advisory databases.
# Kept out of the required checks: a new advisory can appear without any code change,
# and it should raise a red flag, not block unrelated PRs.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - package-lock.json
      - package.json
      - .github/workflows/audit.yml
  schedule:
    # Mondays, 06:00 UTC: catches advisories published since the last change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Fails on high or critical advisories; lower ones are listed in the log.
      - run: npm audit --audit-level=high
